name: Terraform Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/*
env:
  AWS_REGION: "us-east-1"
  TF_WORKSPACE: "dev"

defaults:
  run:
    shell: bash

jobs:
  Preview:
    name: Plan Terraform changes stacks
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Terramate
        uses: terramate-io/terramate-action@v2

      - name: Install asdf
        uses: asdf-vm/actions/setup@v4
        with:
          asdf_branch: v0.15.0

      - name: Install Terraform with asdf
        run: |
          asdf plugin add terraform
          asdf install terraform

      - name: Check Terramate formatting
        run: |
          terramate generate 
          terramate fmt --check
        continue-on-error: true

      - name: List changed stacks
        id: list-changed
        run: terramate list -C stacks/terraform/aws/envs/${{ env.TF_WORKSPACE }} --changed

      - name: Configure AWS credentials
        if: steps.list-changed.outputs.stdout
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::471112931336:role/terraform

      - name: Run Terraform init in all changed stacks
        if: steps.list-changed.outputs.stdout
        run: |
            terramate script run \
            -C stacks/terraform/aws/envs/${{ env.TF_WORKSPACE }} \
            --changed \
            --parallel 1 \
            init
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_WORKSPACE: ${{ env.TF_WORKSPACE }}

      - name: Plan Terraform changes in changed stacks
        id: plan-changed
        if: steps.list-changed.outputs.stdout
        run: |
          terramate script run \
            -C stacks/terraform/aws/envs/${{ env.TF_WORKSPACE }} \
            --changed \
            --parallel 1 \
            --continue-on-error \            
            preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_WORKSPACE: ${{ env.TF_WORKSPACE }}

      - name: Apply Terraform changes stacks
        if: steps.plan-changed.outcome == 'success'
        run: |
          terramate script run \
            -C stacks/terraform/aws/envs/${{ env.TF_WORKSPACE }} \
            --parallel 5 \
            --changed \
            deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_WORKSPACE: ${{ env.TF_WORKSPACE }}