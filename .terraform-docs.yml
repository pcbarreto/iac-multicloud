formatter: markdown table

recursive:
  enabled: true
  path: modules
  include-main: true

#output:
#  file: "README.md"
#  mode: inject
#  template: |-
#    <!-- BEGIN_TF_DOCS -->
#    {{ .Content }}
#    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  hide-empty: true

sections:
  show:
    - header
    - inputs
    - outputs

content: |-
  {{ .Header }}

  {{ .Inputs }}
  
  {{ .Providers }}

  {{ .Resources }}

  {{ .Modules }}

  {{ .DataSources }}

  {{ .Functions }}

  {{ .Variables }}

  {{ .Locals }}

  {{ .TerraformVersion }}

  {{ .Backend }}

  {{ .RequiredProviders }}

  {{ .RequiredVersion }}

  {{ .Outputs }}
